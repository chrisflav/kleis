# What anybody may read, read as anybody: clones and fetches of public
# repositories — a Lake dependency, a toolchain — release downloads, and REST
# reads.  No credential is spent, so nothing private is reachable this way;
# the grants above cover the job's own repositories.  Tried last.

name         = "orchestra-public"
service      = "github"
anonymous    = true
max_lifetime = "24h"

datalog = '''
check if issued_by("orchestra");

allowed("discover") <- operation("discover"), discover_service("git-upload-pack");
allowed("fetch") <- operation("fetch");
allowed("download") <- operation("download");
allowed("read") <- operation("read");
allowed("api_read") <- operation("api_read");
check if allowed($x);

allow if grant("orchestra-public");
'''
