# Labelling issues and pull requests on the upstream: the `label_issue` tool.
# Any issue, any label — GitHub creates a label it does not have, which the
# tool this replaces refused to do; a grant cannot ask the repository which
# labels exist.

name         = "orchestra-triage"
service      = "github"
credential   = "github/orchestra-pat"
max_lifetime = "24h"

datalog = '''
check if issued_by("orchestra");
check if task_tool("label_issue");
check if repository($o, $r), task_upstream($o, $r);

allowed("labels") <- operation("add_labels");
allowed("labels") <- operation("set_labels");
allowed("labels") <- operation("remove_label");
check if allowed($x);

allow if grant("orchestra-triage");
'''
