name: Docker image

# Builds the runtime images on every change, and publishes them to ghcr.io/chrisflav/kleis
# and ghcr.io/chrisflav/kleis-mail (the mail extension's gateway) when the change is on master
# or tagged, both tagged with the same commit so a deployment pins one revision for both.
# Pull requests build but do not push: the point there is to catch a broken Dockerfile on the pull request that caused it rather than on
# master afterwards, and a fork's token cannot push to the registry in any case.

on:
  # Only the default branch on push. A push to any other branch that has an open pull
  # request would otherwise build twice — once for the push and once for the PR — for the
  # same commits, and this is the most expensive job in the repository.
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Superseded runs are worth nothing and this build is long.
concurrency:
  group: docker-${{ github.ref }}
  # Only for pull requests.  On master each commit's image is what a deployment pins
  # by its sha, so a run cancelled by the next push would leave a commit with none.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kleis
            file: docker/Dockerfile
            # The scope the cache had before there were two images, so master's keeps working.
            cache: buildkit
          - image: kleis-mail
            file: docker/mail.Dockerfile
            cache: kleis-mail

    env:
      # Every step that differs between "validate this change" and "ship this change" keys
      # off this, so there is one place to look for what a pull request does differently.
      publish: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v5

      # buildx, for the layer cache below — the classic builder cannot read type=gha.
      - uses: docker/setup-buildx-action@v3

      - if: env.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Not a configured secret: GitHub mints this per run, and `packages: write`
          # above is what makes it able to push.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            # Bare 40-character commit sha (the default `sha-` prefix and short form are
            # both suppressed), so the tag is exactly what `git rev-parse HEAD` prints and
            # a deployment can be pinned to a revision without a lookup table.
            type=sha,format=long,prefix=

      - id: build
        uses: docker/build-push-action@v6
        with:
          # Repository root: every COPY in the Dockerfile is written relative to it.
          context: .
          file: ${{ matrix.file }}
          push: ${{ env.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Without this every run recompiles from nothing. A pull request reads master's
          # cache — the Actions cache falls back to the default branch when a branch has no
          # entry of its own — so a change to the docs reuses the whole build stage.
          cache-from: type=gha,scope=${{ matrix.cache }}
          # Written on master only. mode=max keeps the intermediate stages, which is where
          # the expensive Lean layer lives, but the entries are correspondingly large
          # against the repository's shared 10 GB Actions cache. Letting every pull request
          # write one would evict the master entry that all of them are reading from, so
          # the cache would be least useful exactly when the repository is busiest.
          cache-to: ${{ env.publish == 'true' && format('type=gha,mode=max,scope={0}', matrix.cache) || '' }}

      # The deployment pins a revision by hand (see the NixOS module), so put the line to
      # paste somewhere it can be copied from instead of reconstructed.
      - name: Summarise
        if: env.publish == 'true' && matrix.image == 'kleis'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "To deploy, set in each host's \`kleis.nix\`:"
            echo
            echo '```nix'
            echo '  rev = "${{ github.sha }}";'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
